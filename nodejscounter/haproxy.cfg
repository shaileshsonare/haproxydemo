global
    daemon
    lua-load /etc/haproxy/router.lua

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http
    bind *:8085

    # Call Lua action to determine the target node
    http-request lua.do_routing

    # Use the variable set by Lua for routing
    use_backend %[var(txn.target_node)]

backend node1
    server s1 127.0.0.1:8082 check

backend node2
    server s2 127.0.0.1:8083 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
